[package]
name = "minter"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "minter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]


[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["metadata"] }
# The Stellar gate: typed account structs + CPI clients straight from the
# source program (compile-time contract instead of hand-coded offsets).
solana-stellar = { path = "../../../solana-stellar/programs/solana-stellar", features = ["cpi"] }

